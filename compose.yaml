services:
  app:
    image: jennaahmed/java-sample-app:v1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/labdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: changeme
    depends_on:
      - db
    networks:
      - lab12-network

  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: labdb
    volumes:
      - lab12-postgres-data:/var/lib/postgresql/data
    networks:
      - lab12-network

networks:
  lab12-network:

volumes:
  lab12-postgres-data:
    external: true
